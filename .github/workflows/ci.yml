name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Server and web run as separate steps so BOTH suites always report, even
      # when one fails (a plain `&&` chain would hide the second on the first
      # failure).
      - name: Server tests
        run: npm run test -w server

      - name: Web tests
        run: npm run test -w web -- --run

      - name: Web production build
        run: npm run build -w web
